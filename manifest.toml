packaging_format = 2

id = "it-tools"
name = "IT Tools"
description.en = "Collection of handy online tools for developers"
description.fr = "Collection d'outils pratiques en ligne pour les développeurs"

version = "2026.04.19~ynh2"

maintainers = ["oleole39"]

[upstream]
license = "GPL-3.0-only"
demo = "https://sharevb-it-tools.vercel.app"
code = "https://github.com/sharevb/it-tools"
fund = "https://www.buymeacoffee.com/cthmsst"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "100M"
ram.build = "20M"
ram.runtime = "20M"


[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/it-tools"

    [install.init_main_permission]
    type = "group"
    default = "visitors" 

    [install.enable_htmltopdf_service]
    type = "boolean"
    default = "true"
    ask.en = "Enable server-side feature for 'HTML to PDF' tool ? (This can later be changed)"
    ask.fr = "Activer la fonctionnalité côté serveur pour l'outil 'HTML to PDF' ? (Cela pourra être changé plus tard)"
    help.en = "Whereas this app mostly run client-side, this specific tool requires server-side data processing. Disabling the service will make this tool unavailable"
    help.fr = "Tandis que cette app fonctionne principalement côté client, cet outil en particulier nécessite un traitement de données côté serveur. Désactiver le service rendra cet outil indisponible"

    [install.init_puppeteer-htmltopdf_permission]
    type = "group"
    default = "all_users"
    ask.en = "Who should have access to the server-side feature for 'HTML to PDF' tool  ? (This can later be changed)"
    ask.fr = "Qui peut accéder à la fonctionnalité côté serveur ? (Cela pourra être changé plus tard)"
    help.en = "This might take significant server resources if used intensely"
    help.fr = "Ceci pourrait demander des ressources significatives au serveur si utilisé de façon intense"
    visible = "enable_htmltopdf_service"

    [install.enable_networkutils_service]
    type = "boolean"
    default = "true"
    ask.en = "Enable processing server for network utilities ? (This can later be changed)"
    ask.fr = "Activer la fonctionnalité côté serveur pour les utilitaires réseaux ? (Cela pourra être changé plus tard)"
    help.en = "Whereas this app mostly run client-side, this is a specific feature that requires server-side data processing. Disabling the service will make this tool unavailable"
    help.fr = "Tandis que cette app fonctionne principalement côté client, cet outil en particulier nécessite un traitement de données côté serveur. Désactiver le service rendra cet outil indisponible"

    [install.init_networkutils_permission]
    type = "group"
    default = "all_users"
    ask.en = "Who should have access to the server-side feature for network utilities ? (This can later be changed)"
    ask.fr = "Qui peut accéder à la fonctionnalité côté serveur pour les utilitaires réseaux ? (Cela pourra être changé plus tard)"
    help.en = "This might take significant server resources if used intensely"
    help.fr = "Ceci pourrait demander des ressources significatives au serveur si utilisé de façon intense"
    visible = "enable_networkutils_service"

[resources]

    [resources.sources]

        [resources.sources.main]
        # This is not used as we are using git clone. It's only here for autoupdate.
        url = "https://github.com/sharevb/it-tools/archive/7b151188328dbfca39c70ac1a3036a1f1689cdd2.tar.gz"
        sha256 = "30afe30ab64fe0690cfe2cf318098d1f461ff8774fba4fb8a6f11fff6c85c829"
        prefetch = false
        autoupdate.strategy = "latest_github_commit"
        
        [resources.sources.ynh_build]
        url = "https://github.com/YunoHost-Apps/it-tools_ynh/releases/download/v2026.04.19-7b151188/it-tools_v2026.04.19-7b151188_ynh.zip"
        sha256 = "38e0827f3e4c1b4dcf8bc8cf70bdb9f65ff746d93d10daa495c255bb065d673b"
        format = "zip"
        extract = true
        in_subdir = true

        [resources.sources.puppeteer-htmltopdf]
        url = "https://github.com/sharevb/puppeteer-htmltopdf/archive/774e9a9d002fb0b2bc4c41b04827523eb0398b89.tar.gz"
        sha256 = "ec75227a6afd2b0173cfef693a50ed443e79fa34ebd5593aee5855d71bcc0c3e"
        extract = true
        in_subdir = true
        autoupdate.strategy = "latest_github_commit"

        [resources.sources.network-utilities]
        url = "https://github.com/sharevb/network-utils-ws/archive/7dbd64ef7df2c8c0c9f693eef6aaabdf45051cf9.tar.gz"
        sha256 = "4e7a544e407eeb567177d34f6eb15c4ac3a9b8e90b6c96b96b0d635e1714781b"
        extract = true
        in_subdir = true
        autoupdate.strategy = "latest_github_commit"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"
    puppeteer-htmltopdf.url = "/pdf-service"
    puppeteer-htmltopdf.show_tile = false
    network-utilities.url = "/network-service"
    network-utilities.show_tile = false

    [resources.ports]
    network-utilities.default = 8000

    [resources.apt]
    # Resources only required for url to html conversion feature https://github.com/sharevb/puppeteer-htmltopdf/blob/main/Dockerfile 
    packages = "chromium, chromium-common, chromium-driver, fonts-liberation, libasound2, libatk-bridge2.0-0, libatk1.0-0, libcups2, libdbus-1-3, libdrm2, libgbm1, libgtk-3-0, libnspr4, libnss3, libxcomposite1, libxdamage1, libxfixes3, libxrandr2, wget"

    [resources.nodejs]
    # Resources only required for url to html conversion feature https://github.com/sharevb/puppeteer-htmltopdf/blob/main/Dockerfile 
    version = "20"
